name: source-audit

on:
  push:
  pull_request:

jobs:
  reference-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git show --check --format= HEAD
      - name: Verify MOOSE reference snapshots
        run: >-
          cmake
          -DROOT=${{ github.workspace }}/verification/moose
          -DMANIFEST=${{ github.workspace }}/verification/moose/SHA256SUMS
          -P ${{ github.workspace }}/cmake/VerifySha256.cmake

# The full numerical suite requires the separately installed ADlite, PETSc/MUMPS,
# and Exodus stack documented in AGENTS.md. Release qualification still runs that
# suite in the controlled fuelsim environment; this portable job guards source and
# tracked-reference integrity on every push and pull request.
